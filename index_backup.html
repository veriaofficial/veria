
<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Veria</title> <style> * { box-sizing: border-box; } html { scroll-behavior: smooth; } body { margin: 0; background: #10131c; color: white; font-family: Arial, Helvetica, sans-serif; min-height: 100vh; } button, input { font-family: inherit; } button { cursor: pointer; } .navbar { height: 64px; background: #171b27; border-bottom: 1px solid #292e3d; display: flex; align-items: center; padding: 0 24px; gap: 28px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; } .logo { color: #6ea8ff; font-size: 28px; font-weight: 800; letter-spacing: -1px; user-select: none; } .nav-links { display: flex; align-items: center; gap: 8px; } .nav-btn { background: transparent; border: none; color: #cfd4df; font-size: 15px; padding: 10px 14px; border-radius: 9px; } .nav-btn:hover { background: #242a39; color: white; } .account-area { margin-left: auto; display: flex; align-items: center; gap: 10px; } .icon-btn { width: 42px; height: 42px; border: none; border-radius: 10px; background: #222837; color: white; font-size: 20px; position: relative; } .icon-btn:hover { background: #2d3446; } .notification-dot { position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; padding: 0 4px; background: #ef4444; border-radius: 20px; border: 2px solid #171b27; font-size: 9px; line-height: 12px; font-weight: bold; display: none; } .account-btn { border: none; border-radius: 9px; padding: 10px 16px; font-weight: bold; color: white; } .login-btn { background: #252b3a; } .login-btn:hover { background: #30384b; } .signup-btn { background: #5f91ed; } .signup-btn:hover { background: #78a5f5; } .profile-btn { background: #252b3a; display: none; } .signout-btn { background: #a93e48; display: none; } main { padding: 105px 35px 60px; max-width: 1500px; margin: auto; } .hero-title { font-size: 38px; margin: 0 0 35px; font-weight: 800; } .section { margin-bottom: 45px; } .section-title { font-size: 22px; font-weight: 700; margin-bottom: 18px; } .played-row { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px; } .played-row::-webkit-scrollbar { height: 7px; } .played-row::-webkit-scrollbar-thumb { background: #333b4d; border-radius: 20px; } .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px; } .game-card { background: #191e2b; border: 1px solid #282f40; border-radius: 14px; overflow: hidden; transition: transform .18s, border-color .18s, box-shadow .18s; cursor: pointer; } .game-card:hover { transform: translateY(-4px); border-color: #4d6ea9; box-shadow: 0 10px 30px rgba(0,0,0,.25); } .game-image { height: 145px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; background: linear-gradient(135deg, #28334c, #182131); } .game-info { padding: 15px; } .game-name { font-size: 17px; font-weight: bold; margin-bottom: 6px; } .game-description { color: #969eaf; font-size: 13px; line-height: 1.4; } .played-card { min-width: 210px; max-width: 210px; } .played-card .game-image { height: 120px; } .empty-played { background: #181d29; border: 1px dashed #343c4d; border-radius: 12px; padding: 25px; color: #8e96a8; width: 100%; } .friends-arrow { position: fixed; left: 0; top: 50%; transform: translateY(-50%); width: 42px; height: 76px; border: none; border-radius: 0 14px 14px 0; background: #202636; color: white; font-size: 25px; z-index: 900; box-shadow: 5px 5px 20px rgba(0,0,0,.25); } .friends-arrow:hover { background: #2c3549; } .friends-panel { position: fixed; left: -360px; top: 64px; bottom: 0; width: 340px; background: #171b27; border-right: 1px solid #2b3140; z-index: 950; transition: left .25s ease; padding: 20px; overflow-y: auto; } .friends-panel.open { left: 0; } .friends-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; } .friends-title { font-size: 23px; font-weight: bold; } .close-small { border: none; background: transparent; color: #9ca3b3; font-size: 25px; } .close-small:hover { color: white; } .add-friend-btn { width: 100%; padding: 12px; border: none; border-radius: 9px; background: #5f91ed; color: white; font-weight: bold; margin-bottom: 18px; } .add-friend-btn:hover { background: #76a4f3; } .friend-list { display: flex; flex-direction: column; gap: 8px; } .friend-item { background: #202635; border: 1px solid #2c3445; border-radius: 10px; padding: 11px; display: flex; align-items: center; gap: 10px; } .friend-avatar { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background: #5f91ed; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; } .friend-name { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; } .no-friends { text-align: center; padding: 25px 10px; color: #8f98aa; } .modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; } .modal.show { display: flex; } .modal-box { width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; background: #191e2b; border: 1px solid #30384b; border-radius: 16px; padding: 24px; box-shadow: 0 25px 80px rgba(0,0,0,.45); } .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; } .modal-title { font-size: 24px; font-weight: bold; } .modal-close { background: transparent; border: none; color: #9aa2b2; font-size: 27px; } .modal-close:hover { color: white; } .input { width: 100%; padding: 13px 14px; border-radius: 9px; border: 1px solid #353d50; background: #11151e; color: white; outline: none; margin-bottom: 12px; } .input:focus { border-color: #6699f2; } .primary-btn { width: 100%; border: none; border-radius: 9px; padding: 13px; background: #5f91ed; color: white; font-weight: bold; } .primary-btn:hover { background: #76a4f3; } .secondary-btn { border: none; border-radius: 8px; padding: 9px 13px; background: #30384a; color: white; font-weight: bold; } .search-results { margin-top: 14px; } .request-list { display: flex; flex-direction: column; gap: 10px; } .request-list .friend-item { min-height: 65px; } .request-actions { display: flex; gap: 8px; } .accept-btn { background: #42d66b; color: white; border: none; border-radius: 8px; padding: 9px 13px; font-weight: bold; } .decline-btn { background: #e34b4b; color: white; border: none; border-radius: 8px; padding: 9px 13px; font-weight: bold; } .status-text { color: #9ba3b4; font-size: 13px; margin-top: 10px; min-height: 18px; } .profile-box { text-align: center; } .avatar-area { width: 220px; height: 220px; margin: 0 auto 20px; background: #10151f; border-radius: 18px; border: 1px solid #30384b; display: flex; align-items: center; justify-content: center; } #avatarCanvas { width: 200px; height: 200px; display: block; } .profile-name { font-size: 26px; font-weight: bold; margin-bottom: 6px; } .profile-subtitle { color: #8f98aa; } .login-note { color: #8f98aa; text-align: center; font-size: 13px; margin-top: 15px; } @media (max-width: 700px) { .navbar { padding: 0 12px; gap: 10px; } .logo { font-size: 23px; } .nav-links { display: none; } .account-area { gap: 5px; } .account-btn { padding: 9px 10px; } main { padding: 95px 16px 40px; } .hero-title { font-size: 29px; } .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .game-image { height: 110px; } .friends-panel { width: 300px; left: -320px; } } </style> </head> <body> <nav class="navbar"> <div class="logo">Veria</div>
<div class="nav-links">
    <button class="nav-btn" onclick="goHome()">Home</button>
    <button class="nav-btn" onclick="scrollToGames()">Games</button>
    <button class="nav-btn" onclick="scrollToGames()">Create</button>
</div>

<div class="account-area">
    <button class="icon-btn" onclick="toggleNotifications()" title="Notifications">
        🔔
        <span id="notificationDot" class="notification-dot">0</span>
    </button>

    <button id="loginNavBtn" class="account-btn login-btn" onclick="openModal('loginModal')">
        Log In
    </button>

    <button id="signupNavBtn" class="account-btn signup-btn" onclick="openModal('signupModal')">
        Sign Up
    </button>

    <button id="profileNavBtn" class="account-btn profile-btn" onclick="openProfile()">
        Profile
    </button>

    <button id="signoutNavBtn" class="account-btn signout-btn" onclick="signOut()">
        Sign Out
    </button>
</div>
</nav> <button class="friends-arrow" onclick="toggleFriends()" title="Friends"> → </button> <aside id="friendsPanel" class="friends-panel"> <div class="friends-header"> <div class="friends-title">Friends</div> <button class="close-small" onclick="toggleFriends()">×</button> </div>
<button class="add-friend-btn" onclick="openFriendSearch()">
    + Add Friend
</button>

<div id="friendList" class="friend-list">
    <div class="no-friends">
        Log in to see your friends.
    </div>
</div>
</aside> <main> <h1 class="hero-title">Welcome to Veria</h1>
<section class="section">
    <div class="section-title">Games You Have Played</div>
    <div id="playedGames" class="played-row"></div>
</section>

<section id="gamesSection" class="section">
    <div class="section-title">Games</div>
    <div id="gameGrid" class="game-grid"></div>
</section>
</main> <!-- FRIEND SEARCH --> <div id="friendSearchModal" class="modal"> <div class="modal-box"> <div class="modal-header"> <div class="modal-title">Add Friend</div> <button class="modal-close" onclick="closeModal('friendSearchModal')">×</button> </div>
    <input
        id="friendSearchInput"
        class="input"
        placeholder="Search username..."
        autocomplete="off"
        oninput="searchUsers()"
    >

    <div id="searchResults" class="search-results">
        <div class="no-friends">Type a username to search.</div>
    </div>
</div>
</div> <!-- NOTIFICATIONS --> <div id="notificationsModal" class="modal"> <div class="modal-box"> <div class="modal-header"> <div class="modal-title">Notifications</div> <button class="modal-close" onclick="closeModal('notificationsModal')">×</button> </div>
    <div id="requestList" class="request-list">
        <div class="no-friends">
            No new friend requests.
        </div>
    </div>
</div>
</div> <!-- LOGIN --> <div id="loginModal" class="modal"> <div class="modal-box"> <div class="modal-header"> <div class="modal-title">Log In</div> <button class="modal-close" onclick="closeModal('loginModal')">×</button> </div>
    <input
        id="loginUsername"
        class="input"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        id="loginPassword"
        class="input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button class="primary-btn" onclick="login()">
        Log In
    </button>

    <div id="loginStatus" class="status-text"></div>

    <div class="login-note">

    </div>
</div>
</div> <!-- SIGNUP --> <div id="signupModal" class="modal"> <div class="modal-box"> <div class="modal-header"> <div class="modal-title">Create Account</div> <button class="modal-close" onclick="closeModal('signupModal')">×</button> </div>
    <input
        id="signupUsername"
        class="input"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        id="signupPassword"
        class="input"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
    >

    <button class="primary-btn" onclick="signup()">
        Create Account
    </button>

    <div id="signupStatus" class="status-text"></div>
</div>
</div> <!-- PROFILE --> <div id="profileModal" class="modal"> <div class="modal-box profile-box"> <div class="modal-header"> <div class="modal-title">Profile</div> <button class="modal-close" onclick="closeModal('profileModal')">×</button> </div>
    <div class="avatar-area">
        <canvas id="avatarCanvas" width="200" height="200"></canvas>
    </div>

    <div id="profileName" class="profile-name">Player</div>
    <div class="profile-subtitle">Veria Player</div>
</div>
</div> <script> const API = "http://localhost:5000"; let currentUsername = localStorage.getItem("veriaUsername") || ""; let friends = []; let incomingRequests = []; let outgoingRequests = []; const games = [ { name: "Veyra", icon: "🌎", description: "Explore, survive, build and discover a growing world." }, { name: "Island Adventure", icon: "🏝️", description: "Explore islands and discover what is waiting beyond the shore." }, { name: "Block Builder", icon: "🧱", description: "Build anything you can imagine." }, { name: "Sky Islands", icon: "☁️", description: "Build and survive high above the world." }, { name: "Survival World", icon: "🌲", description: "Gather resources and survive in a dangerous world." }, { name: "City Life", icon: "🏙️", description: "Live your own life in a giant player world." }, { name: "Dungeon Quest", icon: "⚔️", description: "Fight through dangerous dungeons and find treasure." }, { name: "Ocean Explorer", icon: "🌊", description: "Dive beneath the waves and explore the ocean." }, { name: "Build & Battle", icon: "🛡️", description: "Build your base and defend it from other players." }, { name: "Pixel World", icon: "🎮", description: "A colorful pixel world full of things to discover." }, { name: "Adventure Valley", icon: "🏔️", description: "Explore a huge valley filled with secrets." }, { name: "Mystery Island", icon: "🔎", description: "Something strange is happening on this island." } ]; function openModal(id) { const modal = document.getElementById(id); if (modal) { modal.classList.add("show"); } } function closeModal(id) { const modal = document.getElementById(id); if (modal) { modal.classList.remove("show"); } } function goHome() { window.scrollTo({ top: 0, behavior: "smooth" }); } function scrollToGames() { const section = document.getElementById("gamesSection"); if (section) { section.scrollIntoView({ behavior: "smooth" }); } } function toggleFriends() { const panel = document.getElementById("friendsPanel"); panel.classList.toggle("open"); if (panel.classList.contains("open") && currentUsername) { loadFriendData().then(() => { renderFriends(); }); } } function openFriendSearch() { if (!currentUsername) { alert("Please log in first."); return; } document.getElementById("friendSearchInput").value = ""; document.getElementById("searchResults").innerHTML = '<div class="no-friends">Type a username to search.</div>'; openModal("friendSearchModal"); setTimeout(() => { document.getElementById("friendSearchInput").focus(); }, 100); } async function loadFriendData() { if (!currentUsername) { friends = []; incomingRequests = []; outgoingRequests = []; return; } try { const response = await fetch( API + "/friends?username=" + encodeURIComponent(currentUsername) ); const data = await response.json(); if (!response.ok) { throw new Error(data.error || "Could not load friends."); } friends = data.friends || []; incomingRequests = data.incomingRequests || []; outgoingRequests = data.outgoingRequests || []; updateNotificationCount(); } catch (error) { console.error("Friend data error:", error); throw error; } } function renderFriends() { const list = document.getElementById("friendList"); if (!currentUsername) { list.innerHTML = ` <div class="no-friends"> Log in to see your friends. </div> `; return; } if (!friends || friends.length === 0) { list.innerHTML = ` <div class="no-friends"> You don't have any friends yet. </div> `; return; } list.innerHTML = ""; friends.forEach(friend => { const item = document.createElement("div"); item.className = "friend-item"; item.innerHTML = ` <div class="friend-avatar"> ${escapeHtml(friend.charAt(0).toUpperCase())} </div> <div class="friend-name"> ${escapeHtml(friend)} </div> `; list.appendChild(item); }); } async function searchUsers() { const input = document.getElementById("friendSearchInput"); const results = document.getElementById("searchResults"); const query = input.value.trim(); if (!query) { results.innerHTML = ` <div class="no-friends"> Type a username to search. </div> `; return; } results.innerHTML = ` <div class="no-friends"> Searching... </div> `; try { const response = await fetch( API + "/search-users?username=" + encodeURIComponent(query) ); const data = await response.json(); if (!response.ok) { throw new Error(data.error || "Search failed."); } const users = data.users || []; if (users.length === 0) { results.innerHTML = ` <div class="no-friends"> No users found. </div> `; return; } results.innerHTML = ""; users.forEach(user => { const username = user.username; if ( username.toLowerCase() === currentUsername.toLowerCase() ) { return; } const alreadyFriend = friends.some( friend => friend.toLowerCase() === username.toLowerCase() ); const pendingOutgoing = outgoingRequests.some( request => request.toLowerCase() === username.toLowerCase() ); const item = document.createElement("div"); item.className = "friend-item"; let action = ""; if (alreadyFriend) { action = ` <span style="color:#62d17b;font-size:13px;"> Friends </span> `; } else if (pendingOutgoing) { action = ` <span style="color:#aeb6c7;font-size:13px;"> Sent </span> `; } else { action = ` <button class="secondary-btn" onclick="sendFriendRequest('${escapeAttribute(username)}')" > Add </button> `; } item.innerHTML = ` <div class="friend-avatar"> ${escapeHtml(username.charAt(0).toUpperCase())} </div> <div class="friend-name"> ${escapeHtml(username)} </div> ${action} `; results.appendChild(item); }); if (!results.children.length) { results.innerHTML = ` <div class="no-friends"> No users found. </div> `; } } catch (error) { console.error(error); results.innerHTML = ` <div class="no-friends" style="color:#ff7777;"> Could not connect to the Veria account server. </div> `; } } async function sendFriendRequest(username) { if (!currentUsername) { alert("Please log in first."); return; } try { const response = await fetch(API + "/friends/request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: currentUsername, to: username }) }); const data = await response.json(); if (!response.ok) { alert(data.error || "Could not send friend request."); return; } alert("Friend request sent to " + username + "!"); await loadFriendData(); searchUsers(); } catch (error) { console.error(error); alert( "Could not connect to the Veria account server." ); } } /* NOTIFICATION FIX The notification window is opened BEFORE contacting the server. That means a server delay/error can no longer prevent the Notifications window from appearing. Then the actual friend requests are loaded directly from: /friends?username=... */ async function toggleNotifications() { if (!currentUsername) { alert("Please log in first."); return; } openModal("notificationsModal"); const list = document.getElementById("requestList"); list.innerHTML = ` <div style="padding:25px;text-align:center;color:#aaa;"> Loading friend requests... </div> `; try { const response = await fetch( API + "/friends?username=" + encodeURIComponent(currentUsername) ); const data = await response.json(); if (!response.ok) { throw new Error( data.error || "Could not load notifications." ); } incomingRequests = data.incomingRequests || []; outgoingRequests = data.outgoingRequests || []; friends = data.friends || []; renderRequests(); updateNotificationCount(); } catch (error) { console.error("Notification error:", error); list.innerHTML = ` <div style="padding:25px;text-align:center;color:#ff7777;"> Could not load friend requests. <br><br> Make sure the Veria account server is running. </div> `; } } function renderRequests() { const list = document.getElementById("requestList"); if (!incomingRequests || incomingRequests.length === 0) { list.innerHTML = ` <div class="no-friends"> No new friend requests. </div> `; return; } list.innerHTML = ""; incomingRequests.forEach(requester => { const item = document.createElement("div"); item.className = "friend-item"; item.innerHTML = ` <div class="friend-avatar"> ${escapeHtml( requester.charAt(0).toUpperCase() )} </div> <div style="flex:1;min-width:0;"> <div style="font-weight:700;color:white;"> ${escapeHtml(requester)} </div> <div style="font-size:13px;color:#999;margin-top:3px;"> sent you a friend request </div> </div> <div class="request-actions"> <button class="accept-btn" onclick="acceptFriend('${escapeAttribute(requester)}')" > Accept </button> <button class="decline-btn" onclick="declineFriend('${escapeAttribute(requester)}')" > Decline </button> </div> `; list.appendChild(item); }); } async function acceptFriend(requester) { if (!currentUsername) { return; } try { const response = await fetch( API + "/friends/accept", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: currentUsername, requester: requester }) } ); const data = await response.json(); if (!response.ok) { alert( data.error || "Could not accept friend request." ); return; } await loadFriendData(); renderRequests(); renderFriends(); updateNotificationCount(); } catch (error) { console.error(error); alert( "Could not connect to the Veria account server." ); } } async function declineFriend(requester) { if (!currentUsername) { return; } try { const response = await fetch( API + "/friends/decline", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: currentUsername, requester: requester }) } ); const data = await response.json(); if (!response.ok) { alert( data.error || "Could not decline friend request." ); return; } await loadFriendData(); renderRequests(); updateNotificationCount(); } catch (error) { console.error(error); alert( "Could not connect to the Veria account server." ); } } function updateNotificationCount() { const dot = document.getElementById("notificationDot"); if (!currentUsername) { dot.style.display = "none"; return; } const count = incomingRequests.length; if (count > 0) { dot.textContent = count > 99 ? "99+" : count; dot.style.display = "block"; } else { dot.style.display = "none"; } } async function login() { const username = document.getElementById("loginUsername").value.trim(); const password = document.getElementById("loginPassword").value; const status = document.getElementById("loginStatus"); if (!username || !password) { status.textContent = "Enter your username and password."; status.style.color = "#ff7777"; return; } status.textContent = "Logging in..."; status.style.color = "#9ba3b4"; try { const response = await fetch( API + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username, password: password }) } ); const data = await response.json(); if (!response.ok) { status.textContent = data.error || "Login failed."; status.style.color = "#ff7777"; return; } currentUsername = data.username || username; localStorage.setItem( "veriaUsername", currentUsername ); document.getElementById("loginUsername").value = ""; document.getElementById("loginPassword").value = ""; status.textContent = ""; closeModal("loginModal"); updateAccountUI(); try { await loadFriendData(); } catch (error) { console.error(error); } renderFriends(); } catch (error) { console.error(error); status.textContent = "Could not connect to the Veria account server."; status.style.color = "#ff7777"; } } async function signup() { const username = document.getElementById("signupUsername").value.trim(); const password = document.getElementById("signupPassword").value; const status = document.getElementById("signupStatus"); if (!username || !password) { status.textContent = "Enter a username and password."; status.style.color = "#ff7777"; return; } if (username.length < 3) { status.textContent = "Username must be at least 3 characters."; status.style.color = "#ff7777"; return; } if (password.length < 4) { status.textContent = "Password must be at least 4 characters."; status.style.color = "#ff7777"; return; } status.textContent = "Creating account..."; status.style.color = "#9ba3b4"; try { const response = await fetch( API + "/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username, password: password }) } ); const data = await response.json(); if (!response.ok) { status.textContent = data.error || "Could not create account."; status.style.color = "#ff7777"; return; } currentUsername = data.username || username; localStorage.setItem( "veriaUsername", currentUsername ); document.getElementById("signupUsername").value = ""; document.getElementById("signupPassword").value = ""; status.textContent = ""; closeModal("signupModal"); updateAccountUI(); friends = []; incomingRequests = []; outgoingRequests = []; updateNotificationCount(); renderFriends(); } catch (error) { console.error(error); status.textContent = "Could not connect to the Veria account server."; status.style.color = "#ff7777"; } } function signOut() { currentUsername = ""; localStorage.removeItem("veriaUsername"); friends = []; incomingRequests = []; outgoingRequests = []; document.getElementById("friendsPanel") .classList.remove("open"); updateAccountUI(); updateNotificationCount(); renderFriends(); } function updateAccountUI() { const loginBtn = document.getElementById("loginNavBtn"); const signupBtn = document.getElementById("signupNavBtn"); const profileBtn = document.getElementById("profileNavBtn"); const signoutBtn = document.getElementById("signoutNavBtn"); if (currentUsername) { loginBtn.style.display = "none"; signupBtn.style.display = "none"; profileBtn.style.display = "block"; signoutBtn.style.display = "block"; profileBtn.textContent = currentUsername; } else { loginBtn.style.display = "block"; signupBtn.style.display = "block"; profileBtn.style.display = "none"; signoutBtn.style.display = "none"; } } function openProfile() { if (!currentUsername) { alert("Please log in first."); return; } document.getElementById("profileName").textContent = currentUsername; openModal("profileModal"); setTimeout(() => { drawAvatar(); }, 50); } function drawAvatar() { const canvas = document.ge
